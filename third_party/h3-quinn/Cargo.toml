[package]
name = "h3-quinn"
version = "0.0.10"
edition = "2021"
rust-version = "1.70"
license = "MIT"
description = "QUIC transport implementation based on Quinn."
repository = "https://github.com/hyperium/h3"

[features]
datagram = ["dep:h3-datagram"]
tracing = ["dep:tracing"]

[dependencies]
bytes = "1"
futures = "0.3.28"
h3 = "0.0.8"
h3-datagram = { version = "0.0.2", optional = true }
quinn = { path = "../quinn/quinn", version = "0.11.7", default-features = false, features = ["futures-io"] }
tokio = { version = "1", default-features = false, features = ["io-util"] }
tokio-util = "0.7.9"
tracing = { version = "0.1.40", optional = true }
